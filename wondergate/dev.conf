# wgcore-host config for local development (capture server on this Mac).
# Built-in redirects already cover every known WonderGate host; see wg.c.

reception 15
server 127.0.0.1

# Only root can listen below 1024 on macOS, so the capture server uses high ports.
portmap 80 8080
portmap 25 2525
portmap 110 1110
portmap 13 1313
